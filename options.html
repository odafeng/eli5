<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ELI5 Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px;
      max-width: 520px;
      margin: 0 auto;
      color: #333;
      background: #f8f9fa;
    }
    h1 {
      font-size: 22px;
      color: #6c5ce7;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .section {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #e8e8e8;
    }
    .section h2 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #555;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #6c5ce7; }
    .hint {
      font-size: 12px;
      color: #999;
      margin-top: -8px;
      margin-bottom: 12px;
    }
    button {
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #5a4bd1; }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #27ae60;
      display: none;
    }
    .status.error { color: #e74c3c; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge-cloud { background: #dfe6fd; color: #6c5ce7; }
    .badge-local { background: #d5f5e3; color: #27ae60; }
  </style>
</head>
<body>
  <h1>ELI5 Settings</h1>
  <p class="subtitle">Configure your AI provider for ELI5 explanations</p>

  <div class="section">
    <h2><span class="badge badge-cloud">CLOUD</span> Groq API</h2>
    <label for="groqApiKey">API Key</label>
    <input type="password" id="groqApiKey" placeholder="gsk_...">
    <p class="hint">Free at <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a></p>

    <label for="groqModel">Model</label>
    <input type="text" id="groqModel" placeholder="llama-3.3-70b-versatile">
  </div>

  <div class="section">
    <h2><span class="badge badge-local">LOCAL</span> Ollama (Fallback)</h2>
    <label for="ollamaModel">Model</label>
    <input type="text" id="ollamaModel" placeholder="llama3.2">
    <p class="hint">Install Ollama at <a href="https://ollama.com" target="_blank">ollama.com</a>, then run: <code>ollama pull llama3.2</code></p>
  </div>

  <button id="save">Save</button>
  <p class="status" id="status"></p>

  <script src="options.js"></script>
</body>
</html>
